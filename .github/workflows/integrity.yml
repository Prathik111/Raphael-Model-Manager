name: Integrity

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend:
    name: Frontend typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust check + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - run: npm install
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  windows-package:
    name: Windows Tauri bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - run: npm install
      - run: npm run tauri:build
      - name: Verify bundles
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction Stop
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction Stop
          Write-Host "NSIS: $($nsis.FullName)"
          Write-Host "MSI:  $($msi.FullName)"
