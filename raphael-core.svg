<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#05080b"/>
  <g fill="none" stroke="#eef8ff" stroke-width="3" opacity=".78">
    <ellipse cx="64" cy="64" rx="47" ry="17" transform="rotate(18 64 64)">
      <animateTransform attributeName="transform" type="rotate" from="18 64 64" to="378 64 64" dur="5.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="64" cy="64" rx="44" ry="16" transform="rotate(78 64 64)" opacity=".68">
      <animateTransform attributeName="transform" type="rotate" from="78 64 64" to="-282 64 64" dur="4.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="64" cy="64" rx="41" ry="15" transform="rotate(138 64 64)" opacity=".42">
      <animateTransform attributeName="transform" type="rotate" from="138 64 64" to="498 64 64" dur="7.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <circle cx="64" cy="64" r="6" fill="#fff">
    <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="64" r="12" fill="none" stroke="#d8f0ff" stroke-width="2" opacity=".14"/>
</svg>